<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>지식서재 · 임시 기록</title>
    <link rel="stylesheet" href="/offline.css" />
    <script src="/offline.js" defer></script>
  </head>
  <body>
    <main>
      <img src="/library-icon.svg" alt="" width="64" height="64" />
      <h1>연결이 없어도 생각을 남기세요</h1>
      <p>
        이 기기에 임시로 보관합니다. 인터넷이 연결되면 같은 계정으로 서재에
        로그인하고 ‘이 기기의 임시 기록’에서 저장하세요.
      </p>
      <p id="status" role="status"></p>
      <form id="draft-form">
        <label>제목<input name="title" required maxlength="300" /></label
        ><label
          >나의 생각<textarea
            name="content"
            required
            maxlength="50000"
            rows="14"
          ></textarea></label
        ><button type="submit">기기에 임시 저장</button>
      </form>
      <p>기기 저장소 삭제·브라우저 초기화 시 임시 기록도 사라집니다.</p>
      <a href="/">온라인 서재 다시 열기</a>
    </main>
  </body>
</html>
