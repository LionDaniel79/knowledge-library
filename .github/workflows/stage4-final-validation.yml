name: Stage4 final targeted validation
on:
  push:
    branches:
      - feat/stage4-desktop-logos-web
    paths:
      - .github/workflows/stage4-final-validation.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run tests/logos-apply-stage4.test.ts tests/logos-stage4.test.ts tests/pdf-retention-stage4.test.ts tests/desktop-catalog-integration.test.ts tests/desktop-auth.test.ts --maxWorkers=2
      - run: npm run format:check
      - run: npm run build
