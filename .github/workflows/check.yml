name: Library checks
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md", "AGENTS.md"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["docs/**", "README.md", "AGENTS.md"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements-pdf.txt
      - run: python -m pip install -r scripts/requirements-pdf.txt
      - run: python -m unittest discover -s tests -p test_pdf_bulk.py
      - run: python -m unittest discover -s tests -p 'test_*ocr*.py'
      - run: npm run format:check
      - run: npm test -- --maxWorkers=2
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_PRODUCTION: "1"
