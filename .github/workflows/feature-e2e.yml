name: Focused whiteboard browser regression
on:
  push:
    branches:
      - fix/whiteboard-search-bundles-ai-catalog-20261101
    paths:
      - .github/workflows/feature-e2e.yml
      - e2e/thought-bundle-delete.spec.ts
permissions:
  contents: read
jobs:
  focused-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify repeated search and shared thought-box deletion in real browser
        run: npx playwright test e2e/whiteboard.spec.ts e2e/thought-bundle-delete.spec.ts --grep "successive memo searches|memo box deletes|writing-board box delete"
        env:
          PLAYWRIGHT_PRODUCTION: "1"
