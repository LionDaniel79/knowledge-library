name: Stage5 mobile test one-time formatter
on:
  push:
    branches:
      - feat/stage5-windows-https-v2
    paths:
      - ".github/workflows/stage5-mobile-format-once.yml"
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage5-windows-https-v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/pdf-retention-mobile-stage5.test.ts
      - name: Commit formatted mobile safety test
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/pdf-retention-mobile-stage5.test.ts
            git commit -m "style(stage5): format offline mobile restoration regression"
            git pull --rebase origin feat/stage5-windows-https-v2
            git push origin HEAD:feat/stage5-windows-https-v2
          fi
