name: One-time Stage5 retention formatter
on:
  push:
    branches:
      - feat/stage5-windows-https-v2
    paths:
      - ".github/workflows/stage5-retention-format-once.yml"
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage5-windows-https-v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/server/pdf-retention.ts src/server/pdf-retention-policy.ts src/server/desktop-catalog.ts tests/pdf-retention-stage4.test.ts tests/pdf-retention-stage5-safety.test.ts
      - name: Commit formatted sources
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/server/pdf-retention.ts src/server/pdf-retention-policy.ts src/server/desktop-catalog.ts tests/pdf-retention-stage4.test.ts tests/pdf-retention-stage5-safety.test.ts
            git commit -m "style(stage5): format reversible PDF retention policy and regression tests"
            git pull --rebase origin feat/stage5-windows-https-v2
            git push origin HEAD:feat/stage5-windows-https-v2
          fi
