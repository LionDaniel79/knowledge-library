name: Stage4 focused verification
on:
  push:
    branches:
      - feat/stage4-desktop-logos-web
    paths:
      - .github/workflows/stage4-focused-verification.yml
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage4-desktop-logos-web
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format stage4 code
        run: |
          npx prettier --write src/server/desktop-transition.ts src/app/api/desktop/catalog/manifests/'[id]'/apply-selection/route.ts src/app/api/desktop/catalog/cleanup/archive-batch/route.ts tests/desktop-transition.test.ts src/app/api/logos/route.ts src/lib/logos-xml.ts src/lib/logos-contract.ts src/app/logos/import/page.tsx tests/logos-stage4.test.ts
      - name: Commit formatting (if needed)
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/server/desktop-transition.ts src/app/api/desktop/catalog/manifests/'[id]'/apply-selection/route.ts src/app/api/desktop/catalog/cleanup/archive-batch/route.ts tests/desktop-transition.test.ts src/app/api/logos/route.ts src/lib/logos-xml.ts src/lib/logos-contract.ts src/app/logos/import/page.tsx tests/logos-stage4.test.ts
            git commit -m "style(stage4): format guarded PDF transition and Logos importer"
            git pull --rebase origin feat/stage4-desktop-logos-web
            git push origin HEAD:feat/stage4-desktop-logos-web
          fi
      - run: npm run typecheck
      - run: npx vitest run tests/desktop-transition.test.ts tests/desktop-catalog-integration.test.ts tests/logos-stage4.test.ts tests/desktop-catalog-contract.test.ts --maxWorkers=2
      - run: npm run build
