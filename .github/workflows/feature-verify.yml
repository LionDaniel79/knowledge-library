name: Verify and format four fixes
on:
  push:
    branches:
      - fix/whiteboard-search-bundles-ai-catalog-20261101
    paths:
      - .github/workflows/feature-verify.yml
      - src/components/use-paged-resource.ts
      - src/components/assist-panel.tsx
      - src/lib/assist-adoption-overlay.ts
      - tests/assist-adoption-overlay.test.ts
      - src/server/assist-store.ts
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/lib/whiteboard.ts src/components/whiteboard/panel.tsx src/components/whiteboard/chapter-box.tsx src/lib/book-lookup.ts src/server/book-lookup.ts src/components/library-forms.tsx src/server/assist-store.ts src/components/assist-panel.tsx src/components/use-paged-resource.ts src/lib/assist-adoption-overlay.ts tests/whiteboard.test.ts tests/assist-adoption-overlay.test.ts tests/book-lookup.test.ts tests/assist-synthesis-store.test.ts e2e/whiteboard.spec.ts e2e/thought-bundle-delete.spec.ts
      - name: Commit formatting to this feature branch
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/whiteboard.ts src/components/whiteboard/panel.tsx src/components/whiteboard/chapter-box.tsx src/lib/book-lookup.ts src/server/book-lookup.ts src/components/library-forms.tsx src/server/assist-store.ts src/components/assist-panel.tsx src/components/use-paged-resource.ts src/lib/assist-adoption-overlay.ts tests/whiteboard.test.ts tests/assist-adoption-overlay.test.ts tests/book-lookup.test.ts tests/assist-synthesis-store.test.ts e2e/whiteboard.spec.ts e2e/thought-bundle-delete.spec.ts
            git commit -m "style: format four-fix sources and tests"
            git push origin HEAD:refs/heads/fix/whiteboard-search-bundles-ai-catalog-20261101
          fi
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run tests/whiteboard.test.ts tests/book-lookup.test.ts tests/assist-adoption-overlay.test.ts tests/assist-synthesis-store.test.ts tests/thought-bundle-delete.test.ts --maxWorkers=2
