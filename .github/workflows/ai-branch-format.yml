name: Format AI feature branch once
on:
  push:
    branches:
      - fix/ai-note-bundle-adoption-controls-20261101
    paths:
      - .github/workflows/ai-branch-format.yml
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/fix/ai-note-bundle-adoption-controls-20261101'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format changed AI sources and tests
        run: |
          npx prettier --write src/components/assist-help.tsx src/components/assist-panel.tsx src/components/assist-request-card.tsx src/components/whiteboard/writing-assist.tsx src/components/use-paged-resource.ts src/client/replica/request.ts src/lib/assist-synthesis.ts src/lib/assist.ts src/local/ai/openai.ts src/server/assist-store.ts src/server/assist-synthesis.ts tests/assist-synthesis.test.ts tests/assist-synthesis-store.test.ts e2e/assist.spec.ts
      - name: Commit formatting only to this feature branch
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/assist-help.tsx src/components/assist-panel.tsx src/components/assist-request-card.tsx src/components/whiteboard/writing-assist.ts src/components/use-paged-resource.ts src/client/replica/request.ts src/lib/assist-synthesis.ts src/lib/assist.ts src/local/ai/openai.ts src/server/assist-store.ts src/server/assist-synthesis.ts tests/assist-synthesis.test.ts tests/assist-synthesis-store.test.ts e2e/assist.spec.ts
            git commit -m "style(ai): format updated source and regression tests"
            git push origin HEAD:refs/heads/fix/ai-note-bundle-adoption-controls-20261101
          fi
