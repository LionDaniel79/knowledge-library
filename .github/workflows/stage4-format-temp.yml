name: Stage4 temporary formatter
on:
  push:
    branches: [feat/stage4-desktop-logos-web]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write src/lib/desktop-catalog-contract.ts src/lib/logos-contract.ts src/lib/logos-xml.ts src/server/desktop-auth.ts src/server/desktop-catalog.ts src/server/logos-import.ts src/server/logos-cover.ts src/server/cover-mirrors.ts src/components/import-panel.tsx src/app/api/desktop src/app/api/logos src/app/desktop src/app/logos tests/desktop-catalog-contract.test.ts tests/desktop-catalog-integration.test.ts scripts/migrate.ts
          git add -u
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(stage4): run project Prettier formatting'
            git push
          fi
