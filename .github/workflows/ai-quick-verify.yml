name: AI feature fast verify
on:
  push:
    branches:
      - fix/ai-note-bundle-adoption-controls-20261101
    paths:
      - .github/workflows/ai-quick-verify.yml
      - tests/assist-synthesis-store.test.ts
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run tests/assist-synthesis.test.ts tests/assist-synthesis-store.test.ts tests/assist-store.test.ts --maxWorkers=2
